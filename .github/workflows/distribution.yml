name: Distribution first start
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download both actual release installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $runtimeVersion = (Get-Content runtime-manifest.json -Raw | ConvertFrom-Json).version
          $runtimeDownload = Get-Content runtime-download.json -Raw | ConvertFrom-Json
          $fullAsset = [IO.Path]::GetFileName(([uri]$runtimeDownload.url).AbsolutePath)
          $lightAsset = "dsh-chapter-whale-$version.tgz"
          New-Item -ItemType Directory artifacts/full, artifacts/light | Out-Null
          gh release download "v$runtimeVersion" --repo thus-zhou/dsh-chapter-whale --pattern $fullAsset --dir artifacts/full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download "v$version" --repo thus-zhou/dsh-chapter-whale --pattern $lightAsset --dir artifacts/light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CHAPTER_WHALE_FULL_ASSET=$fullAsset" >> $env:GITHUB_ENV
          "CHAPTER_WHALE_LIGHT_ASSET=$lightAsset" >> $env:GITHUB_ENV
      - name: Start the actual full package in a new workspace
        shell: pwsh
        run: |
          node scripts/verify-package.mjs "artifacts/full/$env:CHAPTER_WHALE_FULL_ASSET" - artifacts/full-result.json
          exit $LASTEXITCODE
      - name: Start the lightweight package using the live GitHub download
        shell: pwsh
        run: |
          node scripts/verify-package.mjs "artifacts/light/$env:CHAPTER_WHALE_LIGHT_ASSET" - artifacts/light-result.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-start-results
          path: artifacts/*-result.json
