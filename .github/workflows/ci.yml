name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Only offline suites that need no editor dependencies. Tests that import
      # services.* (the editor app) stay out of CI until their dependency set is
      # pinned; nothing here calls a model or touches user data.
      - name: Chapter version store (offline, no model calls)
        run: python -m unittest discover -s backend/integration -p "test_chapter_versions.py" -t backend -v
      - name: Budget and context limits (offline, no model calls)
        run: python -m unittest discover -s backend/integration -p "test_budget.py" -t backend -v
      - name: Quality score and gate (offline, no model calls)
        run: python -m unittest discover -s backend/integration -p "test_quality.py" -t backend -v
      - name: Style learning and profile (offline, no model calls)
        run: python -m unittest discover -s backend/integration -p "test_style.py" -t backend -v
      - name: Revision previews and anchors (offline, no model calls)
        run: python -m unittest discover -s backend/integration -p "test_revision.py" -t backend -v
      - name: Version history and restore (offline, no model calls)
        run: python -m unittest discover -s backend/integration -p "test_history.py" -t backend -v
      - name: Install manager test dependencies
        run: python -m pip install --disable-pip-version-check --no-input "fastapi>=0.110" "httpx>=0.27"
      - name: Manager checks (offline, no model calls)
        run: python -m unittest discover -s backend/manager -p "test_*.py" -t backend -v
