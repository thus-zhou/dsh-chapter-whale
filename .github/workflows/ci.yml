name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # 必须在任何清单重算之前运行：它逐字节核对清单与干净检出，
      # 一旦有人在 CRLF 工作树上重建过清单，这一步会立刻失败而不是等到发版。
      - name: Release manifest matches checked-out bytes
        run: node scripts/check-release.mjs --local
      - run: npm test
  backend:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners default to a legacy console code page; these suites and
      # their messages are UTF-8, so force UTF-8 mode instead of cp1252.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 一次性安装全部离线测试依赖；不涉及真实模型调用或外部账号/平台写入。
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check --no-input "fastapi>=0.110" "httpx>=0.27" "python-multipart>=0.0.9" "tzdata>=2024.1" "filelock>=3.12" "aiohttp>=3.9"
      - name: Integration checks (offline, no model calls)
        run: python -B -X utf8 -m unittest discover -s backend/integration -p "test_*.py" -t backend -v
      - name: Manager checks (offline, no model calls)
        run: python -B -X utf8 -m unittest discover -s backend/manager -p "test_*.py" -t backend -v
